name: Build VOSHIFT Android
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm i -g @bubblewrap/cli
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > voshift-release.keystore
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | bubblewrap update --skipVersionUpgrade || true
          ls
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks voshift-release.keystore --ks-key-alias voshift --ks-pass env:BUBBLEWRAP_KEYSTORE_PASSWORD --key-pass env:BUBBLEWRAP_KEY_PASSWORD --out app-release-signed.apk aligned.apk
          cp app/build/outputs/bundle/release/app-release.aab app-release-bundle.aab
          jarsigner -keystore voshift-release.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" app-release-bundle.aab voshift
          $BT/apksigner verify --print-certs app-release-signed.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: voshift-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
      - name: Publish to dist branch
        run: |
          mkdir -p /tmp/out && cp app-release-signed.apk /tmp/out/voshift.apk && cp app-release-bundle.aab /tmp/out/voshift.aab
          git config user.name VOSHIFT && git config user.email voshift@gmail.com
          git checkout --orphan dist && git rm -rf . -q && cp /tmp/out/* . && git add voshift.apk voshift.aab
          git commit -m "build ${{ github.run_number }}" && git push -f origin dist
