name: Build VOSHIFT Android
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm i -g @bubblewrap/cli
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > voshift-release.keystore
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | bubblewrap update --skipVersionUpgrade
          yes | bubblewrap build --skipPwaValidation
          ls -la *.apk *.aab
      - uses: actions/upload-artifact@v4
        with:
          name: voshift-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
